name: Prediction-market feasibility probe

# Manual only. Read-only look at Kalshi / Polymarket / Open-Meteo / NOAA. Never touches picks or ledger.json.
on:
  workflow_dispatch:
  # Dev-branch runs: dispatch needs the file on main, so a push touching this marker file also starts it.
  push:
    branches: [claude/weather-prediction-market-edge-i61672]
    paths: [predmkt/RUN_PROBE]

permissions:
  contents: write

concurrency:
  group: predmkt-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe
        run: python -m predmkt.probe2 2>&1 | tee predmkt_probe2_report.txt
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add predmkt_probe2_report.txt
          git commit -m "predmkt feasibility probe 2 report" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
