name: Update football picks

on:
  schedule:
    - cron: "17 8 * * *"   # daily, 08:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-picks
  cancel-in-progress: false

jobs:
  picks:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: picks/requirements.txt

      - run: pip install -r picks/requirements.txt

      - name: Run tests
        run: python -m unittest picks.tests.test_picks

      - name: Fetch results, odds and fixtures
        run: python -m picks.cli fetch

      - name: Fetch real xG from Understat (optional)
        continue-on-error: true   # scraper may break if the site changes; picks fall back to the shots proxy
        run: python -m picks.cli fetch-xg

      - name: Generate picks
        run: python -m picks.cli picks --seed-backtest --out ledger.json

      - name: Model report (evaluate and calibrate on real data)
        continue-on-error: true
        run: |
          {
            echo '## Evaluate: model variants vs bookmaker prices (lower is better)'
            python -m picks.cli evaluate
            echo
            echo '## Calibrate: stated vs actual win rates'
            python -m picks.cli calibrate
            echo
            echo '## Strategies: market-anchored model and best-price betting (flat one-unit stakes, out of sample)'
            python -m picks.cli strategies
            echo
            echo '## Tune: model settings, picked on early matches and checked on late ones'
            python -m picks.cli tune
          } > report.txt 2>&1 || true
          cat report.txt
          { echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit ledger.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger.json report.txt 2>/dev/null || git add ledger.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Automated paper-trading update"
            git push
          fi
