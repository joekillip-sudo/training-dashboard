name: Softer markets experiment

# Manual only. Does the model do better against less efficient markets? Uses its own data folder and
# never touches ledger.json or the daily picks.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: softer-markets
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: picks/requirements.txt

      - run: pip install -r picks/requirements.txt

      - name: Fetch 16 leagues
        run: >
          python -m picks.cli fetch --no-fixtures --out picks/data_ext
          --leagues E0 SP1 D1 I1 F1 E1 D2 SP2 I2 F2 E2 E3 EC SC0 SC1 SC2 SC3 N1 B1 P1 T1 G1

      - name: Fetch real xG for the top 5 (optional)
        continue-on-error: true
        run: python -m picks.cli fetch-xg

      - name: League report
        run: |
          python -m picks.cli leagues --data picks/data_ext > leagues_report.txt 2>&1 || { cat leagues_report.txt; exit 1; }
          cat leagues_report.txt
          { echo '```'; cat leagues_report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit leagues_report.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leagues_report.txt
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Softer markets report"
            git pull --rebase origin main
            git push
          fi
