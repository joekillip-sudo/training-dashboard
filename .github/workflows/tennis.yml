name: Tennis backtest

# Manual only. Does a simple Elo model beat bookmaker prices in ATP/WTA tennis? Fetches tennis-data.co.uk,
# runs a walk-forward backtest, and commits tennis_report.txt. Never touches ledger.json or the daily picks.
on:
  workflow_dispatch:
  push:
    branches: [ccr-310de746-511ys8]   # TEMPORARY while developing on this branch; removed before the PR
    paths: ["tennis/**", ".github/workflows/tennis.yml"]

permissions:
  contents: write

concurrency:
  group: tennis
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tennis/requirements.txt

      - run: pip install -r tennis/requirements.txt

      - name: Unit tests
        run: python -m unittest tennis.tests.test_tennis

      - name: Fetch ATP and WTA yearly files
        timeout-minutes: 12
        run: python -m tennis.cli fetch --out tennis/data_raw

      - name: Backtest report
        run: |
          python -m tennis.cli report --data tennis/data_raw --out tennis_report.txt > report_stdout.txt 2>&1 || { cat report_stdout.txt; exit 1; }
          cat tennis_report.txt
          { echo '```'; cat tennis_report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit tennis_report.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tennis_report.txt
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Tennis backtest report"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
